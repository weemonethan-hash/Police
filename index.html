<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Camera Proximity Beeper</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 12px; background:#fff; color:#111; }
  #controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  #videoContainer { position:relative; width:100%; max-width:640px; margin-bottom:12px; }
  video#video { width:100%; height:auto; background:#000; transform:scaleX(-1); } /* mirrored for user-friendly view */
  canvas#overlay { position:absolute; left:0; top:0; pointer-events:none; transform:scaleX(-1); }
  #status { font-size:0.9rem; color:#333; }
  label { font-size:0.9rem; }
  input[type=range] { width:160px; }
  button { padding:6px 10px; }
</style>
</head>
<body>

<div id="controls">
  <button id="startBtn">Start (allow camera & model)</button>
  <button id="stopBtn" disabled>Stop</button>
  <label><input type="checkbox" id="debugChk"> Debug (show camera + overlay)</label>
  <label>Min detect %: <input id="minFrac" type="range" min="0.002" max="0.05" step="0.001" value="0.006"></label>
  <label>Max detect %: <input id="maxFrac" type="range" min="0.02" max="0.5" step="0.01" value="0.2"></label>
  <div id="status">idle</div>
</div>

<div id="videoContainer" style="display:none;">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.6.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
<script>
(async ()=> {
  let model = null;
  const startBtn = document.getElementById('startBtn');
  const stopBtn  = document.getElementById('stopBtn');
  const debugChk  = document.getElementById('debugChk');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const videoContainer = document.getElementById('videoContainer');
  const status = document.getElementById('status');
  const minFracInput = document.getElementById('minFrac');
  const maxFracInput = document.getElementById('maxFrac');

  let stream = null;
  let running = false;
  let detectLoopId = null;
  let audioCtx = null;
  let lastBeepScheduled = 0;

  function log(s){ status.textContent = s; }

  async function loadModel() {
    log('loading model...');
    model = await cocoSsd.load();
    log('model loaded.');
  }

  async function startCamera() {
    // prefer back camera
    const constraintsTry = [
      { video: { facingMode: { exact: "environment" } } },
      { video: { facingMode: "environment" } },
      { video: true }
    ];
    for (const c of constraintsTry) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: c.video, audio: false });
        break;
      } catch(e) {
        // try next
      }
    }
    if (!stream) throw new Error('Could not access camera.');
    video.srcObject = stream;
    await video.play();
    // size overlay to video
    overlay.width = video.videoWidth || 640;
    overlay.height = video.videoHeight || 480;
    overlay.style.width = video.offsetWidth + 'px';
    overlay.style.height = video.offsetHeight + 'px';
    videoContainer.style.display = debugChk.checked ? 'block' : 'none';
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.pause();
    video.srcObject = null;
  }

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function beepOnce(duration = 0.08, freq = 700, when = 0) {
    ensureAudioContext();
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + duration + 0.02);
  }

  function scheduleBeepsForRate(beepsPerSec, totalWindowSec = 0.9) {
    // schedule beeps across next window
    if (beepsPerSec <= 0) return;
    const now = performance.now();
    // avoid scheduling too often
    if (now - lastBeepScheduled < (totalWindowSec * 500)) {
      // allow rescheduling if significantly different
    }
    lastBeepScheduled = now;
    const count = Math.max(1, Math.round(beepsPerSec * totalWindowSec));
    const interval = totalWindowSec / count;
    for (let i=0;i<count;i++){
      beepOnce(0.06, 700, i*interval);
    }
  }

  function computeBeepRateFromAreaFrac(areaFrac, minFrac, maxFrac) {
    // areaFrac in [0,1], minFrac..maxFrac define mapping range
    // below min -> single occasional beep; above max -> very rapid beeps
    if (areaFrac <= minFrac) return 0.6; // 0.6 beeps/sec -> slow single beeps
    const clamped = Math.min(1, (areaFrac - minFrac) / Math.max(1e-6, (maxFrac - minFrac)));
    // map to range [0.6, 8] beeps/sec
    return 0.6 + clamped * (8 - 0.6);
  }

  async function detectLoop() {
    if (!running) return;
    if (!model) {
      log('model not loaded');
      return;
    }
    try {
      // use model.detect on video element
      const predictions = await model.detect(video, 5);
      // find largest bounding box area
      const vW = video.videoWidth || overlay.width;
      const vH = video.videoHeight || overlay.height;
      let maxArea = 0;
      let best = null;
      for (const p of predictions) {
        const [x,y,w,h] = p.bbox;
        const area = w*h;
        if (area > maxArea) {
          maxArea = area;
          best = p;
        }
      }
      const areaFrac = maxArea / (vW*vH);
      const minFrac = parseFloat(minFracInput.value);
      const maxFrac = parseFloat(maxFracInput.value);
      const beepRate = computeBeepRateFromAreaFrac(areaFrac, minFrac, maxFrac);

      // Schedule beeps proportionally
      scheduleBeepsForRate(beepRate);

      // Debug overlay
      if (debugChk.checked) {
        videoContainer.style.display = 'block';
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
        ctx.lineWidth = 3;
        ctx.font = '20px Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.strokeStyle = 'lime';
        for (const p of predictions) {
          const [x,y,w,h] = p.bbox;
          ctx.strokeRect(x, y, w, h);
          ctx.fillText(p.class + ' ' + Math.round(p.score*100) + '%', x+4, y+20);
        }
        if (best) {
          ctx.fillStyle = 'yellow';
          ctx.fillText('areaFrac: ' + areaFrac.toFixed(4), 10, overlay.height - 10);
        } else {
          ctx.fillStyle = 'yellow';
          ctx.fillText('No object detected', 10, overlay.height - 10);
        }
      } else {
        videoContainer.style.display = 'none';
      }

      log(`objects ${predictions.length} · areaFrac ${areaFrac.toFixed(4)} · beeps/sec ${beepRate.toFixed(2)}`);
    } catch (e) {
      console.error(e);
      log('detection error: ' + e.message);
    } finally {
      // loop
      detectLoopId = setTimeout(detectLoop, 300); // run ~3x/sec (tweakable)
    }
  }

  startBtn.addEventListener('click', async ()=>{
    try {
      startBtn.disabled = true;
      await loadModel(); // load if not already
      await startCamera();
      running = true;
      stopBtn.disabled = false;
      // user interaction may be required to unlock audio on some browsers
      try { ensureAudioContext(); if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume(); } catch(e){}
      detectLoop();
    } catch (err) {
      console.error(err);
      log('error: ' + (err && err.message ? err.message : err));
      startBtn.disabled = false;
    }
  });

  stopBtn.addEventListener('click', ()=>{
    running = false;
    clearTimeout(detectLoopId);
    stopCamera();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    log('stopped');
  });

  // hide debug view on toggle
  debugChk.addEventListener('change', ()=> {
    videoContainer.style.display = debugChk.checked && running ? 'block' : 'none';
  });

  // simple instruction to user
  log('idle — press Start (model will download)');
})();
</script>
</body>
</html>
