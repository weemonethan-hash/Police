<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass App</title>
<style>
:root{
  --bg:#071019; --panel:#0b1420; --muted:#8ea3b3; --accent:#7ee3a8; --danger:#ef6b6b;
}
body,html{margin:0;padding:0;height:100%;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#e6f3f5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
header{width:100%;padding:16px;text-align:center;font-size:1.5rem;font-weight:600;color:var(--accent);}
.compass{margin-top:20px;width:250px;height:250px;border:4px solid var(--accent);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;}
.needle{width:4px;height:120px;background:var(--danger);position:absolute;top:20px;left:50%;transform-origin:bottom center;transform:rotate(0deg);}
#street{margin-top:20px;font-size:1.2rem;}
.plates-section{margin-top:20px;width:90%;max-width:600px;background:var(--panel);padding:12px;border-radius:10px;}
.plate-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.1);}
.plate-code{font-weight:600;}
.plate-flag{color:var(--danger);margin-left:8px;}
input, button{padding:6px;margin:4px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#fff;}
button{cursor:pointer;}
</style>
</head>
<body>
<header>Compass App</header>
<div class="compass"><div class="needle" id="needle"></div></div>
<div id="street">Street: ...</div>

<div class="plates-section">
<h3>Plate Tracker</h3>
<input type="text" id="plateInput" placeholder="Enter Plate">
<input type="text" id="flagInput" placeholder="Flag (optional)">
<button id="savePlate">Save Plate</button>
<br>
<input type="text" id="searchInput" placeholder="Search Plates">
<button id="clearAll">Clear All</button>
<div id="platesList"></div>
</div>

<script>
// --- LOGIN PROTECTION ---
const loggedBadge = sessionStorage.getItem('loggedIn');
const allAccounts = JSON.parse(localStorage.getItem('accounts')) || [];
const user = allAccounts.find(a => a.badge === loggedBadge && !a.admin);
if(!user){
    alert('You must log in with a normal account!');
    window.location.href = 'login.html';
} else {
    sessionStorage.removeItem('loggedIn'); // enforce logout on refresh
}

// --- COMPASS ---
const needle = document.getElementById('needle');
if(window.DeviceOrientationEvent){
  window.addEventListener('deviceorientation', e=>{
    let alpha = e.alpha || 0;
    alpha = alpha + 90; // +90° offset
    needle.style.transform = `rotate(${alpha}deg)`;
  });
}

// --- STREET (basic simulation) ---
const streetEl = document.getElementById('street');
function updateStreet(){
  // Placeholder street name (you can integrate GPS API if desired)
  streetEl.textContent = `Street: Main St`;
}
updateStreet();

// --- PLATES ---
const plateInput=document.getElementById('plateInput');
const flagInput=document.getElementById('flagInput');
const savePlateBtn=document.getElementById('savePlate');
const platesList=document.getElementById('platesList');
const searchInput=document.getElementById('searchInput');
const clearAllBtn=document.getElementById('clearAll');

function loadPlates(){const raw=localStorage.getItem('plates'); return raw?JSON.parse(raw):[];}
function savePlates(arr){localStorage.setItem('plates',JSON.stringify(arr)); renderPlates();}
function renderPlates(){
  const arr=loadPlates();
  const filter=searchInput.value.toLowerCase();
  platesList.innerHTML='';
  arr.filter(p=>p.code.toLowerCase().includes(filter) || (p.flag||'').toLowerCase().includes(filter)).forEach((p,i)=>{
    const div=document.createElement('div'); div.className='plate-item';
    const codeEl=document.createElement('div'); codeEl.className='plate-code'; codeEl.textContent=p.code;
    div.appendChild(codeEl);
    if(p.flag){const flagEl=document.createElement('div'); flagEl.className='plate-flag'; flagEl.textContent=p.flag; div.appendChild(flagEl);}
    const del=document.createElement('button'); del.textContent='🗑'; del.onclick=()=>{arr.splice(i,1);savePlates(arr);}
    div.appendChild(del);
    platesList.appendChild(div);
  });
}

savePlateBtn.addEventListener('click',()=>{
  const code=plateInput.value.trim().toUpperCase(); if(!code) return;
  const flag=flagInput.value.trim();
  const arr=loadPlates(); arr.push({code,flag}); savePlates(arr);
  plateInput.value=''; flagInput.value='';
});
searchInput.addEventListener('input',renderPlates);
clearAllBtn.addEventListener('click',()=>{if(confirm('Clear all plates?')){localStorage.removeItem('plates'); renderPlates();}});
renderPlates();
</script>
</body>
</html>
